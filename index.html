<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirection en cours...</title>
</head>
<body>
    <p>Redirection vers la page d'avis...</p>

    <script>
        // Votre liste de correspondances (Card ID -> Lien Google du client)
        const redirections = {
            "1": "https://search.google.com/local/writereview?placeid=ChIJqXrl4Z4d4UcRZi69qvNvR48",
            "2": "https://g.page/r/ExempleBoulanger"
        };

        const urlParams = new URLSearchParams(window.location.search);
        const carteId = urlParams.get('c');

        if (carteId && redirections[carteId]) {
            window.location.replace(redirections[carteId]);
        } else {
            document.body.innerHTML = "<h1>Cette carte n'est pas encore configurée.</h1>";
        }
    </script>
</body>
</html>
